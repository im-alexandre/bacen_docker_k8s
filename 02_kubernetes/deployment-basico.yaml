apiVersion: apps/v1
kind: Deployment
metadata:
  name: bacen-web
  namespace: bacen-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bacen-web
  template:
    metadata:
      labels:
        app: bacen-web
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: web
          image: bacen-lab-web:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dados
              mountPath: /data
      volumes:
        - name: dados
          emptyDir: {}
